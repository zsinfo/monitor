<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login Segreteria - {{ scuola.nome_scuola }}</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1b2a; color: #e0e1dd; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background-color: #1b263b; border: 1px solid #415a77; border-radius: 10px; padding: 30px; width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; }
        h2 { color: #00b4d8; margin-top: 0; }
        form { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        input { padding: 10px; border-radius: 5px; border: 1px solid #415a77; background-color: #0d1b2a; color: white; font-size: 14px; }
        button { background-color: #00b4d8; color: white; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #0077b6; }
        .error { color: #e63946; font-size: 13px; margin-top: 10px; }
        .back-link { display: block; margin-top: 15px; color: #8d99ae; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔒 Segreteria</h2>
        <p style="font-size: 14px; color: #8d99ae;">{{ scuola.nome_scuola }}</p>
        <p style="font-size: 12px; color: #48cae4;">Codice: {{ scuola.codice_meccanografico }}</p>
        
        <form action="/login/{{ scuola.id }}" method="post">
            <input type="password" name="password" placeholder="Password Segreteria" required>
            <button type="submit">Accedi al Pannello</button>
        </form>

        {% if errore %}
        <div class="error">Password errata. Riprova.</div>
        {% endif %}

        <a href="/" class="back-link">← Torna alla Home</a>
    </div>
</body>
</html>
